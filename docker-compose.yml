volumes:
  awg:

services:
  awg:
    image: ghcr.io/gennadykataev/awg-easy:latest
    container_name: awg
    environment:
      - LANG=en
      - WG_HOST=${WG_HOST:-YOUR_SERVER_IP}
      # - PASSWORD_HASH=${WG_PASSWORD_HASH:-YOUR_ADMIN_PASSWORD_HASH}
      - PORT=51821
      - WG_PORT=51820
    volumes:
      - awg:/etc/wireguard
      - awg:/etc/amnezia/amneziawg
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    devices:
      - /dev/net/tun:/dev/net/tun

  database:
    image: postgres
    container_name: database

    ports:
      - ${POSTGRES_PORT:-5432}:${POSTGRES_PORT:-5432}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-db}


  backend:
    build:
      context: ./backend
    container_name: backend_container

    ports:
      - ${SWAGGER_PORT:-8000}:${SWAGGER_PORT:-8000}
    environment:
      DB_PATH: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-admin}@database/${POSTGRES_DB:-db}
      DB_ECHO: ${DB_ECHO:-1}
      API_PATH: ${API_PATH:-/api}
    depends_on:
      - database
    restart: always

  bot:
    build:
      context: ./bot
    container_name: bot_container

    environment:
      BOT_TOKEN: ${BOT_TOKEN:-1234567890:AABBccddeeffgghhjj-AAbbccddeeffgghh}
      DB_API: "http://backend:${SWAGGER_PORT:-8000}/api"
      AWG_API: ${AWG_API:-http://awg:51821/api/wireguard}
      ADMIN_ID: ${ADMIN_ID:-123456789}
    depends_on:
      - backend
      - awg
    restart: always
